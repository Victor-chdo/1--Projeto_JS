<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <script src="/scripts.js" defer></script>

    <title>Conversor de Moedas</title>
</head>

<body>
    <img class="logo" src="/assets/cash-logo.gif" alt="logo">

    <main>
        <label>Converter <b>de</b>

            <select class="currency-select-value-to-convert">
                <option value="BRL">BRL - Real Brasileiro</option>
                <option value="USD">USD - Dólar Americano</option>
                <option value="EUR">EUR - Euro</option>
                <option value="GBP">GBP - Libra Esterlina</option>
                <option value="BTC">BTC - Bitcoin</option>
            </select>
        </label>

        <label>Converter <b>para</b>

            <select class="currency-select">
                <option value="BRL">R$ - Real Brasileiro</option>
                <option value="USD">US$ - Dólar Americano</option>
                <option value="EUR">€ - Euro</option>
                <option value="GBP">£ - Libra Esterlina</option>
                <option value="BTC">₿ - BitCoin</option>
            </select>
        </label>

        <label>
            Valor
            <input class="input-currency" placeholder="R$ 10.000,00">
        </label>

        <button class="convert-button">Converter</button>

        <section>
            <div class="currency-box">
                <img class="currency-img-aC" src="/assets/Real.svg" alt="Logo-moeda-aConverter">
                <p class="currency">Real</p>
                <p class="currency-value-to-convert">R$ 0,00</p>
            </div>

            <img class="arrow" src="/assets/Vector.svg" alt="seta">

            <div class="currency-box">
                <img class="currency-img" src="/assets/Dolar.svg" alt="Logo-moeda-convertida">
                <p class="currency" id="currency-name">Dólar americano</p>
                <p class="currency-value">US$ 0.0</p>
            </div>
        </section>
    </main>

</body>

</html>
